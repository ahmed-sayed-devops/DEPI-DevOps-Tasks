name: Java Maven CI/CD

on:
  workflow_dispatch:

concurrency:
  group: java-maven-ci
  cancel-in-progress: true

env:
  IMAGE_NAME: a7medsayed/depi-java-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment:
      name: YOU_NAME

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build JAR
        working-directory: GH_Actions_tasks/GitHub_Task_1
        run: |
          mvn clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: GH_Actions_tasks/GitHub_Task_1/target/*.jar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: GH_Actions_tasks/GitHub_Task_1
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ env.IMAGE_NAME }}:latest