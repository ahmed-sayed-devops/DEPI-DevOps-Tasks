apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "webapp.labels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "webapp.labels" . | nindent 8 }}

    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          ports:
            - containerPort: 80
